<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="536" viewBox="0 0 1010 536" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t-04-semantic-tiers"><title id="t-04-semantic-tiers">Semantic Model tiers (LST-inspired, graceful fallback)</title><defs><marker id="m-g" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#94A3B8"/></marker><marker id="m-o" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#EA580C"/></marker><marker id="m-b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#2563EB"/></marker><marker id="m-gr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#16A34A"/></marker><marker id="m-p" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#7C3AED"/></marker></defs><rect x="0" y="0" width="1010" height="536" fill="#ffffff"/><text x="24" y="30" font-size="20" font-weight="700" fill="#0F172A">Semantic Model tiers (LST-inspired, graceful fallback)</text><rect x="24" y="44" width="14" height="14" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/><text x="44" y="55.5" font-size="12" fill="#475569">deterministic (engine / CLI)</text><rect x="251.44" y="44" width="14" height="14" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="3 2"/><text x="271.44" y="55.5" font-size="12" fill="#475569">artifact</text><rect x="32" y="96" width="520" height="100" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/><text x="46" y="126.64" font-size="14.5" font-weight="700" fill="#1E3A8A">T2 · compiler-accurate (where it runs in Node)</text><text x="46" y="143.75" font-size="11.5" fill="#475569">TS compiler API: ts.createProgram + TypeChecker</text><text x="46" y="158.75" font-size="11.5" fill="#475569">pyright (npm) for Python, optional</text><text x="46" y="173.75" font-size="11.5" fill="#475569">types · symbol binding · calls · handler binding</text><rect x="32" y="236" width="520" height="100" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/><text x="46" y="266.64" font-size="14.5" font-weight="700" fill="#1E3A8A">T1 · index-based (optional external tools)</text><text x="46" y="283.75" font-size="11.5" fill="#475569">SCIP indexers: scip-java · scip-dotnet · scip-python</text><text x="46" y="298.75" font-size="11.5" fill="#475569">external binaries, Apache-2.0</text><text x="46" y="313.75" font-size="11.5" fill="#475569">definitions · references · signatures</text><rect x="32" y="376" width="520" height="100" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/><text x="46" y="406.64" font-size="14.5" font-weight="700" fill="#1E3A8A">T0 · tree-sitter (always available)</text><text x="46" y="423.75" font-size="11.5" fill="#475569">today's tier: ts/js · python · rust · java · c#</text><text x="46" y="438.75" font-size="11.5" fill="#475569">+ syntactic types · DDL column types</text><text x="46" y="453.75" font-size="11.5" fill="#475569">+ route-prefix composition from the AST</text><path d="M150 196 L150 234" fill="none" stroke="#EA580C" stroke-width="1.6" marker-end="url(#m-o)"/><text x="162" y="220" font-size="11.5" fill="#9A3412">not available → fall back</text><path d="M150 336 L150 374" fill="none" stroke="#EA580C" stroke-width="1.6" marker-end="url(#m-o)"/><text x="162" y="360" font-size="11.5" fill="#9A3412">not available → fall back</text><rect x="632" y="96" width="352" height="64" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2.6" stroke-dasharray="4 3"/><text x="808" y="123.8" font-size="15" font-weight="700" text-anchor="middle" fill="#334155">Semantic Model</text><text x="808" y="141" font-size="11.5" text-anchor="middle" fill="#475569">scan-manifest.json + additive typed fields</text><path d="M552 146 L630 128" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#m-g)"/><path d="M552 286 L600 286 L600 140 L630 140" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#m-g)"/><path d="M552 426 L612 426 L612 152 L630 152" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#m-g)"/><rect x="632" y="196" width="352" height="214" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6"/><text x="646" y="223.07" font-size="13.5" font-weight="700" fill="#475569">New facts (all additive)</text><text x="646" y="240" font-size="11.5" fill="#475569">field · param · return types</text><text x="646" y="255" font-size="11.5" fill="#475569">inheritance (extends / implements)</text><text x="646" y="270" font-size="11.5" fill="#475569">decorators / annotations as data</text><text x="646" y="285" font-size="11.5" fill="#475569">calls · reads · writes · derives_from edges</text><text x="646" y="300" font-size="11.5" fill="#475569">endpoint → handler binding + full path</text><text x="646" y="315" font-size="11.5" fill="#475569">column types · keys · FKs · relations</text><text x="646" y="330" font-size="11.5" fill="#475569">config / env surface</text><text x="646" y="345" font-size="11.5" fill="#475569">messaging producers / consumers</text><text x="646" y="360" font-size="11.5" fill="#475569">class-qualified, overload-safe ids</text><text x="646" y="375" font-size="11.5" fill="#475569">body-aware fingerprints (incremental)</text><text x="646" y="390" font-size="11.5" fill="#475569">tier provenance on every fact</text><text x="32" y="512" font-size="12" fill="#64748B">Not copied from the LST: lossless formatting. Unwind never edits the source, so whitespace fidelity buys nothing.</text></svg>
