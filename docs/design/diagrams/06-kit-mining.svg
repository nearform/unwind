 x="142" y="300.5" font-size="11.5" text-anchor="middle" fill="#475569">pinned per rebuild</text><rect x="288" y="244" width="220" height="72" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/><text x="398" y="268.3" font-size="15" font-weight="700" text-anchor="middle" fill="#1E3A8A">Golden tests</text><text x="398" y="285.5" font-size="11.5" text-anchor="middle" fill="#475569">spec fragment → expected</text><text x="398" y="300.5" font-size="11.5" text-anchor="middle" fill="#475569">idempotence run</text><path d="M286 280 L254 280" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#m-g)"/><rect x="544" y="244" width="220" height="72" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.6"/><text x="654" y="268.3" font-size="15" font-weight="700" text-anchor="middle" fill="#1E3A8A">Regenerate gate</text><text x="654" y="285.5" font-size="11.5" text-anchor="middle" fill="#475569">recipe(fragment) ≡ exemplar ?</text><text x="654" y="300.5" font-size="11.5" text-anchor="middle" fill="#475569">via the verifier</text><path d="M542 280 L510 280" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#m-g)"/><rect x="800" y="244" width="220" height="72" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/><text x="910" y="268.3" font-size="15" font-weight="700" text-anchor="middle" fill="#9A3412">Parameterize</text><text x="910" y="285.5" font-size="11.5" text-anchor="middle" fill="#475569">exemplar → template</text><text x="910" y="300.5" font-size="11.5" text-anchor="middle" fill="#475569">+ recipe.ts</text><path d="M798 280 L766 280" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#m-g)"/><path d="M910 164 L910 242" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#m-g)"/><path d="M654 316 L654 352 L878 352 L878 318" fill="none" stroke="#EA580C" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#m-o)"/><text x="766" y="370" font-size="11.5" text-anchor="middle" fill="#9A3412">fail → re-pa