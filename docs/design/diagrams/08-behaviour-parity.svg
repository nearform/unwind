<svg xmlns="http://www.w3.org/2000/svg" width="1044" height="536" viewBox="0 0 1044 536" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t-08-behaviour-parity"><title id="t-08-behaviour-parity">Behaviour parity: the same scenarios against legacy and rebuild</title><defs><marker id="m-g" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#94A3B8"/></marker><marker id="m-o" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#EA580C"/></marker><marker id="m-b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#2563EB"/></marker><marker id="m-gr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#16A34A"/></marker><marker id="m-p" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#7C3AED"/></marker></defs><rect x="0" y="0" width="1044" height="536" fill="#ffffff"/><text x="24" y="30" font-size="20" font-weight="700" fill="#0F172A">Behaviour parity: the same scenarios against legacy and rebuild</text><rect x="24" y="44" width="14" height="14" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/><text x="44" y="55.5" font-size="12" fill="#475569">deterministic (engine / CLI)</text><rect x="251.44" y="44" width="14" height="14" rx="4" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/><text x="271.44" y="55.5" font-size="12" fill="#475569">LLM agent</text><rect x="355.76" y="44" width="14" height="14" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="3 2"/><text x="375.76" y="55.5" font-size="12" fill="#475569">artifact</text><rect x="40" y="84" width="190" height="64" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2.6" stroke-dasharray="4 3"/><text x="135" y="111.8" font-size="15" font-weight="700" text-anchor="middle" fill="#334155">Spec</text><text x="135" y="129" font-size="11.5" text-anchor="middle" fill="#475569">endpoints · entities · rules</text><rect x="270" y="84" width="320" height="64" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/><text x="430" y="104.3" font-size="15" font-weight="700" text-anchor="middle" fill="#9A3412">Scenario generation</text><text x="430" y="121.5" font-size="11.5" text-anchor="middle" fill="#475569">Spec · MUST rules · grill · legacy tests</text><text x="430" y="136.5" font-size="11.5" text-anchor="middle" fill="#475569">recorded traffic (HAR / proxy / UI)</text><rect x="630" y="84" width="390" height="64" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="4 3"/><text x="825" y="111.8" font-size="15" font-weight="700" text-anchor="middle" fill="#334155">Scenarios</text><text x="825" y="129" font-size="11.5" text-anchor="middle" fill="#475569">given · when · then (or record) · covers: [ids]</text><path d="M230 116 L268 116" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#m-g)"/><path d="M590 116 L628 116" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#m-g)"/><rect x="40" y="184" width="980" height="76" rx="10" fill="#FBFCFE" stroke="#CBD5E1" stroke-width="1.6" stroke-dasharray="6 4"/><text x="56" y="204" font-size="12.5" font-weight="700" fill="#1E3A8A">Boundary drivers (pluggable; each degrades to "manual / not runnable")</text><rect x="56" y="218" width="85" height="26" rx="13" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.3"/><text x="98.5" y="235.5" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1E3A8A">HTTP / API</text><rect x="149" y="218" width="134" height="26" rx="13" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.3"/><text x="216" y="235.5" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1E3A8A">DB state snapshots</text><rect x="291" y="218" width="252" height="26" rx="13" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.3"/><text x="417" y="235.5" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1E3A8A">Browser: Playwright + agent recording</text><rect x="551" y="218" width="240" height="26" rx="13" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.3"/><text x="671" y="235.5" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1E3A8A">Desktop: computer-use (best-effort)</text><rect x="799" y="218" width="91" height="26" rx="13" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.3"/><text x="844.5" y="235.5" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1E3A8A">CLI / batch</text><rect x="898" y="218" width="78" height="26" rx="13" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.3"/><text x="937" y="235.5" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1E3A8A">Messaging</text><path d="M825 148 L825 182" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#m-g)"/><rect x="40" y="300" width="220" height="62" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6"/><text x="150" y="326.8" font-size="15" font-weight="700" text-anchor="middle" fill="#475569">Legacy app</text><text x="150" y="344" font-size="11.5" text-anchor="middle" fill="#475569">sandbox only, never prod</text><rect x="290" y="300" width="230" height="62" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="4 3"/><text x="405" y="326.8" font-size="15" font-weight="700" text-anchor="middle" fill="#334155">Goldens</text><text x="405" y="344" font-size="11.5" text-anchor="middle" fill="#475569">responses · DB side-effects</text><rect x="40" y="400" width="480" height="62" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/><text x="280" y="426.8" font-size="15" font-weight="700" text-anchor="middle" fill="#9A3412">rw-observe: enrich the Spec</text><text x="280" y="444" font-size="11.5" text-anchor="middle" fill="#475569">provenance "observed" · disagreements → grill questions</text><path d="M150 260 L150 298" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#m-g)"/><path d="M260 331 L288 331" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#m-g)"/><path d="M405 362 L405 398" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#m-g)"/><path d="M40 431 L22 431 L22 116 L38 116" fill="none" stroke="#EA580C" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#m-o)"/><rect x="580" y="300" width="200" height="62" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6"/><text x="680" y="326.8" font-size="15" font-weight="700" text-anchor="middle" fill="#475569">Target app</text><text x="680" y="344" font-size="11.5" text-anchor="middle" fill="#475569">rebuilt service</text><rect x="810" y="300" width="210" height="62" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/><text x="915" y="326.8" font-size="15" font-weight="700" text-anchor="middle" fill="#1E3A8A">Normalize + map</text><text x="915" y="344" font-size="11.5" text-anchor="middle" fill="#475569">scrub ids / time · vs goldens</text><rect x="580" y="400" width="440" height="62" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2.6" stroke-dasharray="4 3"/><text x="800" y="426.8" font-size="15" font-weight="700" text-anchor="middle" fill="#334155">Parity report</text><text x="800" y="444" font-size="11.5" text-anchor="middle" fill="#475569">parity % over [MUST] scenarios → loop termination signal</text><path d="M680 260 L680 298" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#m-g)"/><path d="M780 331 L808 331" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#m-g)"/><path d="M915 362 L915 398" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#m-g)"/><text x="40" y="496" font-size="12" fill="#64748B">Kit recipes also emit the scenarios as native target tests (e.g. vitest + supertest), so parity becomes the rebuilt repo's regression suite.</text><text x="40" y="514" font-size="12" fill="#64748B">Legacy can't run? Scenarios stay as Spec acceptance criteria; goldens come from domain experts via the questions/ flow.</text></svg>
