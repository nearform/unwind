2" fill="#64748B">Context coverage = share of [MUST] Spec nodes with no open high-priority gap, reported next to doc coverage and parity %.</text><text x="32" y="480" font-size="12" fill="#64748B">The grill's checkbox questionnaires (questions/) become one audience-specific output of this round: one ingest path, not two.</text></svg>
