<svg xmlns="http://www.w3.org/2000/svg" width="1124" height="612" viewBox="0 0 1124 612" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t-07-play-loop"><title id="t-07-play-loop">Play build loop: generate → holes → fill → verify</title><defs><marker id="m-g" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#94A3B8"/></marker><marker id="m-o" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#EA580C"/></marker><marker id="m-b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#2563EB"/></marker><marker id="m-gr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#16A34A"/></marker><marker id="m-p" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#7C3AED"/></marker></defs><rect x="0" y="0" width="1124" height="612" fill="#ffffff"/><text x="24" y="30" font-size="20" font-weight="700" fill="#0F172A">Play build loop: generate → holes → fill → verify</text><rect x="24" y="44" width="14" height="14" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/><text x="44" y="55.5" font-size="12" fill="#475569">deterministic (engine / CLI)</text><rect x="251.44" y="44" width="14" height="14" rx="4" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/><text x="271.44" y="55.5" font-size="12" fill="#475569">LLM agent</text><rect x="355.76" y="44" width="14" height="14" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="3 2"/><text x="375.76" y="55.5" font-size="12" fill="#475569">artifact</text><rect x="453.6" y="44" width="14" height="14" rx="4" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/><text x="473.6" y="55.5" font-size="12" fill="#475569">human / external</text><rect x="32" y="84" width="190" height="56" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="4 3"/><text x="127" y="107.8" font-size="15" font-weight="700" text-anchor="middle" fill="#334155">Spec</text><text x="127" y="125" font-size="11.5" text-anchor="middle" fill="#475569">MUST / SHOULD nodes</text><rect x="248" y="84" width="190" height="56" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.6"/><text x="343" y="107.8" font-size="15" font-weight="700" text-anchor="middle" fill="#14532D">Target Kit</text><text x="343" y="125" font-size="11.5" text-anchor="middle" fill="#475569">pinned kit@version</text><rect x="32" y="176" width="406" height="62" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/><text x="235" y="202.8" font-size="15" font-weight="700" text-anchor="middle" fill="#1E3A8A">Generate (blueprint)</text><text x="235" y="220" font-size="11.5" text-anchor="middle" fill="#475569">recipes: scan → generate → edit</text><path d="M127 140 L127 174" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#m-g)"/><path d="M343 140 L343 174" fill="none" stroke="#16A34A" stroke-width="1.6" marker-end="url(#m-gr)"/><rect x="32" y="270" width="406" height="56" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="4 3"/><text x="235" y="293.8" font-size="15" font-weight="700" text-anchor="middle" fill="#334155">Target code with holes</text><text x="235" y="311" font-size="11.5" text-anchor="middle" fill="#475569">structure correct by construction</text><rect x="32" y="358" width="406" height="56" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/><text x="235" y="381.8" font-size="15" font-weight="700" text-anchor="middle" fill="#9A3412">LLM fills holes</text><text x="235" y="399" font-size="11.5" text-anchor="middle" fill="#475569">business logic only · keeps @unwind-id</text><rect x="32" y="446" width="406" height="62" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.6"/><text x="235" y="472.8" font-size="15" font-weight="700" text-anchor="middle" fill="#1E3A8A">Verify</text><text x="235" y="490" font-size="11.5" text-anchor="middle" fill="#475569">structure + types · unfilled hole = claimed</text><rect x="32" y="540" width="406" height="50" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="4 3"/><text x="235" y="560.8" font-size="15" font-weight="700" text-anchor="middle" fill="#334155">MUST completeness ≥ target ?</text><text x="235" y="578" font-size="11.5" text-anchor="middle" fill="#475569">yes → done · no → loop</text><path d="M235 238 L235 268" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#m-g)"/><path d="M235 326 L235 356" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#m-g)"/><path d="M235 414 L235 444" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#m-g)"/><path d="M235 508 L235 538" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#m-g)"/><path d="M438 565 L462 565 L462 207 L440 207" fill="none" stroke="#EA580C" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#m-o)"/><text x="470" y="392" font-size="11.5" fill="#9A3412">loop</text><rect x="520" y="140" width="580" height="244" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6"/><text x="536" y="162" font-size="12" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" style="white-space:pre" fill="#334155">src/routes/orders.ts</text><rect x="528" y="271" width="564" height="80" rx="6" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.2" stroke-dasharray="4 3"/><text x="536" y="184" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" style="white-space:pre" fill="#64748B">// generated: endpoint→hono-route (hono-drizzle-zod@1.0.0)</text><text x="536" y="204" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" style="white-space:pre" fill="#0F172A">app.post('/orders',</text><text x="536" y="224" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" style="white-space:pre" fill="#0F172A">  zValidator('json', OrderCreate),</text><text x="536" y="244" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" style="white-space:pre" fill="#0F172A">  async (c) =&gt; {</text><text x="536" y="264" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" style="white-space:pre" fill="#0F172A">    const input = c.req.valid('json')</text><text x="536" y="284" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" style="white-space:pre" fill="#9A3412">    // @unwind-hole id=operation:src/orders/service.ts:placeOrder</text><text x="536" y="304" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" style="white-space:pre" fill="#9A3412">    //   kind=operation doc=layers/service/orders.md#placeorder</text><text x="536" y="324" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" style="white-space:pre" fill="#9A3412">    throw new NotImplemented('placeOrder')</text><text x="536" y="344" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" style="white-space:pre" fill="#9A3412">    // @unwind-end</text><text x="536" y="364" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" style="white-space:pre" fill="#0F172A">  })</text><path d="M700 112 L700 136" fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#m-b)"/><text x="708" y="106" font-size="11.5" fill="#1E3A8A">method · path · schema exact → verifies as equivalent</text><path d="M800 400 L800 374" fill="none" stroke="#EA580C" stroke-width="1.6" marker-end="url(#m-o)"/><text x="808" y="414" font-size="11.5" fill="#9A3412">only this region is written by the LLM</text><text x="520" y="450" font-size="12" fill="#64748B">Regeneration rewrites generator-owned code but preserves</text><text x="520" y="466" font-size="12" fill="#64748B">filled holes, so the loop is safe to re-run.</text></svg>
