xt><path d="M900 234 L900 276" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#m-g)"/><rect x="40" y="278" width="1020" height="82" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.6"/><text x="550" y="315.44" font-size="17" font-weight="700" text-anchor="middle" fill="#1E3A8A">@unwind/engine</text><text x="550" y="333" font-size="11.5" text-anchor="middle" fill="#475569">model · rewind (scan, detectors, spec, observe, context-gaps) · play (kits, recipes, generate, verify, parity) · store</text><path d="M370 360 L370 398" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#m-g)"/><path d="M750 360 L750 398" fill="none" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#m-g)"/><rect x="200" y="400" width="340" height="56" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="4 3"/><text x="370" y="423.8" font-size="15" font-weight="700" text-anchor="middle" fill="#334155">docs/unwind/ files</text><text x="370" y="441" font-size="11.5" text-anchor="middle" fill="#475569">source of truth · git-friendly</text><rect x="580" y="400" width="340" height="56" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="4 3"/><text x="750" y="423.8" font-size="15" font-weight="700" text-anchor="middle" fill="#334155">node:sqlite index</text><text x="750" y="441" font-size="11.5" text-anchor="middle" fill="#475569">later · rebuildable · multi-repo queries</text><text x="40" y="492" font-size="12" fill="#64748B">Every MCP tool and HTTP route maps 1:1 to a CLI command, so behaviour is identical across surfaces.</text></svg>
