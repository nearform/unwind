<svg xmlns="http://www.w3.org/2000/svg" width="720" height="874" viewBox="0 0 720 874" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t-11-roadmap"><title id="t-11-roadmap">Roadmap: each phase shippable, graceful fallback kept</title><defs><marker id="m-g" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#94A3B8"/></marker><marker id="m-o" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#EA580C"/></marker><marker id="m-b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#2563EB"/></marker><marker id="m-gr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#16A34A"/></marker><marker id="m-p" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#7C3AED"/></marker></defs><rect x="0" y="0" width="720" height="874" fill="#ffffff"/><text x="24" y="30" font-size="20" font-weight="700" fill="#0F172A">Roadmap: each phase shippable, graceful fallback kept</text><rect x="24" y="44" width="14" height="14" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/><text x="44" y="55.5" font-size="12" fill="#475569">deterministic (engine / CLI)</text><rect x="251.44" y="44" width="14" height="14" rx="4" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/><text x="271.44" y="55.5" font-size="12" fill="#475569">new in destination</text><rect x="414.08000000000004" y="44" width="14" height="14" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="3 2"/><text x="434.08000000000004" y="55.5" font-size="12" fill="#475569">artifact</text><line x1="62" y1="96" x2="62" y2="822" stroke="#CBD5E1" stroke-width="3"/><circle cx="62" cy="96" r="17" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" stroke-dasharray="3 2"/><text x="62" y="100.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#334155">0</text><text x="96" y="90" font-size="14" font-weight="700" fill="#0F172A">Phase 0 · Design</text><text x="96" y="107" font-size="11.5" fill="#475569">builds: design doc set + HTML site</text><text x="96" y="123" font-size="11.5" fill="#15803D">exit: reviewed and agreed</text><circle cx="62" cy="162" r="17" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="62" y="166.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1E3A8A">1</text><text x="96" y="156" font-size="14" font-weight="700" fill="#0F172A">Phase 1 · Shared model + Spec v1</text><text x="96" y="173" font-size="11.5" fill="#475569">builds: @unwind/model · rw-spec · typed stack profile</text><text x="96" y="189" font-size="11.5" fill="#15803D">exit: drizzle-cube → valid Spec, typed entities + endpoints</text><circle cx="62" cy="228" r="17" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/><text x="62" y="232.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#4C1D95">2</text><text x="96" y="222" font-size="14" font-weight="700" fill="#0F172A">Phase 2 · CLI + Server MVP + split</text><text x="96" y="239" font-size="11.5" fill="#475569">builds: unwind CLI · serve (Hono, git, sqlite) · tokens · push/pull · slices</text><text x="96" y="255" font-size="11.5" fill="#15803D">exit: team pushes ≥3 slices to one server; board shows them; 409 path works</text><circle cx="62" cy="294" r="17" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/><text x="62" y="298.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#4C1D95">3</text><text x="96" y="288" font-size="14" font-weight="700" fill="#0F172A">Phase 3 · Kits + recipe engine + starter kit</text><text x="96" y="305" font-size="11.5" fill="#475569">builds: kit schema · scan/generate/edit runtime · holes · hono-drizzle-zod</text><text x="96" y="321" font-size="11.5" fill="#15803D">exit: db + api slices generate, compile, verify equivalent; re-run = no diff</text><circle cx="62" cy="360" r="17" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="62" y="364.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1E3A8A">4</text><text x="96" y="354" font-size="14" font-weight="700" fill="#0F172A">Phase 4 · Semantic Model T0 / T2</text><text x="96" y="371" font-size="11.5" fill="#475569">builds: TS compiler tier · calls/handler/reads/writes · detector registry</text><text x="96" y="387" font-size="11.5" fill="#15803D">exit: TS sources fully typed; verifier diffs field types</text><circle cx="62" cy="426" r="17" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/><text x="62" y="430.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#4C1D95">5</text><text x="96" y="420" font-size="14" font-weight="700" fill="#0F172A">Phase 5 · Kit mining</text><text x="96" y="437" font-size="11.5" fill="#475569">builds: pl-kit mine · exemplar → recipe · regenerate gate · versioning</text><text x="96" y="453" font-size="11.5" fill="#15803D">exit: kit mined from repo A rebuilds repo B in house style</text><circle cx="62" cy="492" r="17" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/><text x="62" y="496.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#4C1D95">5b</text><text x="96" y="486" font-size="14" font-weight="700" fill="#0F172A">Phase 5b · Behaviour parity</text><text x="96" y="503" font-size="11.5" fill="#475569">builds: scenarios · HTTP + DB drivers · rw-observe · pl-parity</text><text x="96" y="519" font-size="11.5" fill="#15803D">exit: API scenarios recorded on legacy, replayed on rebuild → parity %</text><circle cx="62" cy="558" r="17" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/><text x="62" y="562.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#4C1D95">5c</text><text x="96" y="552" font-size="14" font-weight="700" fill="#0F172A">Phase 5c · Context gaps</text><text x="96" y="569" font-size="11.5" fill="#475569">builds: gap register · routed briefs · response adapter · context-ingest</text><text x="96" y="585" font-size="11.5" fill="#15803D">exit: briefs for ≥3 audiences; answers ingested with provenance</text><circle cx="62" cy="624" r="17" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/><text x="62" y="628.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#4C1D95">5d</text><text x="96" y="618" font-size="14" font-weight="700" fill="#0F172A">Phase 5d · Slice convergence + Play by slice</text><text x="96" y="635" font-size="11.5" fill="#475569">builds: merge fragments · uncovered/overlaps/conflicts/seams · strangler order</text><text x="96" y="651" font-size="11.5" fill="#15803D">exit: 100% convergence; one slice rebuilt + verified via seam adapters</text><circle cx="62" cy="690" r="17" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="62" y="694.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1E3A8A">6</text><text x="96" y="684" font-size="14" font-weight="700" fill="#0F172A">Phase 6 · MCP adapter</text><text x="96" y="701" font-size="11.5" fill="#475569">builds: unwind mcp, 1:1 with the CLI / API</text><text x="96" y="717" font-size="11.5" fill="#15803D">exit: non-Claude agents get identical results</text><circle cx="62" cy="756" r="17" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="62" y="760.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1E3A8A">7</text><text x="96" y="750" font-size="14" font-weight="700" fill="#0F172A">Phase 7 · App depth + portfolio</text><text x="96" y="767" font-size="11.5" fill="#475569">builds: metrics over time · conflict UX · answers in UI · Recipe Book</text><text x="96" y="783" font-size="11.5" fill="#15803D">exit: portfolio across N projects; kits browsable / editable</text><circle cx="62" cy="822" r="17" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="62" y="826.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1E3A8A">8</text><text x="96" y="816" font-size="14" font-weight="700" fill="#0F172A">Phase 8 · Breadth</text><text x="96" y="833" font-size="11.5" fill="#475569">builds: SCIP tier (Java / C# / Python) · Spring + FastAPI kits · blueprints</text><text x="96" y="849" font-size="11.5" fill="#15803D">exit: ≥3 typed source languages · ≥3 starter kits</text></svg>
