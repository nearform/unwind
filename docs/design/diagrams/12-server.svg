#94A3B8" stroke-width="1.6" stroke-dasharray="4 3"/><text x="945" y="330.8" font-size="15" font-weight="700" text-anchor="middle" fill="#334155">node:sqlite (Drizzle)</text><text x="945" y="348" font-size="11.5" text-anchor="middle" fill="#475569">users · hashed tokens · slices</text><text x="945" y="363" font-size="11.5" text-anchor="middle" fill="#475569">runs · metrics · FTS5 search</text><text x="945" y="378" font-size="11.5" text-anchor="middle" fill="#475569">index rebuildable from git</text><rect x="556" y="416" width="512" height="48" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.6"/><text x="812" y="445" font-size="11.5" text-anchor="middle" fill="#475569">Team in the browser: leads, reviewers, experts (token login)</text><text x="24" y="510" font-size="12" fill="#64748B">TLS / SSO via a reverse proxy later. Backup = copy the /data volume. The server never needs repository access.</text></svg>
